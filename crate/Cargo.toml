[package]
name = "urls-le"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
description = "Extract every URL in a codebase, with its protocol and exact position"
authors = ["Nolin D Naidoo"]
homepage = "https://letools.dev/tools/urls-le"
repository = "https://github.com/nolindnaidoo/urls-le"
keywords = ["url", "link-checker", "links", "extract", "lychee"]
categories = ["command-line-utilities", "development-tools", "web-programming", "text-processing", "parsing"]
# What a consumer gets, and why.
#
# Ships: src/, Cargo.toml, Cargo.lock, LICENSE, README.md — needed to
# build the binary. SPEC.md and CHANGELOG.md — the behavioural contract
# someone scripting against the exit codes needs. tests/ and fixtures/ —
# not needed to *build* (verified: the crate compiles without them), but
# needed to *verify*: `cargo test` on the unpacked tarball runs the full
# corpus, so the parity claims in the README are checkable by whoever
# installed it rather than taken on trust.
#
# Excluded: AGENTS.md and CLAUDE.md are how this repo is worked on, not
# how the tool is used. rust-toolchain.toml is a convenience for
# contributors to *this* checkout; shipped, it would pin the toolchain
# of anyone who unpacks or vendors the crate, which is not this crate's
# business.
exclude = ["AGENTS.md", "CLAUDE.md", "rust-toolchain.toml"]

[[bin]]
name = "urls-le"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# One regex engine, unlike paths-le and secrets-le: the URL scanner uses
# no backreferences and no lookaround, so `regex` expresses it exactly
# and its matching cannot fail. Nothing here needs a backtracking engine,
# and not taking one is the cheaper answer.
regex = "1"
# The one format parser left, chosen to match what the extension uses:
# toml for @iarna/toml. JSON is a hand-rolled token scanner, because the
# offsets have to be the raw document's and a parser hands back values;
# INI stopped parsing at all in 0.2.0, because which library each language
# installed was deciding the answer. Markdown, HTML, CSS and JavaScript
# are regex in the extension and regex here.
#
# `preserve_order` for the same reason paths-le needs it: without it a
# TOML table iterates alphabetically and extraction stops following the
# document.
toml = { version = "1", features = ["preserve_order"] }
# `domain` and `path` come from a WHATWG URL parse. The extension uses
# the platform parser; this is the same standard, a different
# implementation, and the corpus pins where they might disagree.
url = "2"
# The walker. `ignore` is ripgrep's, so "what this tool walks" and "what
# ripgrep walks" are the same answer — which is the answer a person
# auditing a repository already has in their head.
ignore = "0.4"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
# Every output of this tool is a claim someone scripts against — a line
# number, a column, a count. A wrapped number is silently wrong data in a
# report whose whole value is honesty, which is worse than a crash — so
# overflow keeps panicking in release, as it does in debug. (Same rule as
# pixelcoords, pixelactions and scrape-le.)
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Deliberate relaxations, same policy as the other crates: no inline
# #[allow] anywhere (CI enforces); anything relaxed must be listed here,
# visibly.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
