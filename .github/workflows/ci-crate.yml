# The Rust CLI's CI. Lives beside ci.yml rather than inside it because
# ci.yml is byte-identical across the ten *-le repos (letools-site's
# fleet check); this file is invisible to that check.
#
# Paths include the extension's extraction sources on purpose: parity
# must fail when EITHER side drifts from the shared corpus, and an edit
# to src/extraction/heuristics.ts would otherwise land green.
name: CI (crate)

on:
  # Manually runnable as well as push-triggered. Push events are not
  # guaranteed: during a GitHub Actions incident they are throttled and
  # silently dropped, and a dropped event never replays — leaving a
  # commit with no way to be verified. Dispatch is the escape hatch.
  # ci.yml cannot have this: it is byte-identical across the ten *-le
  # repos and the fleet check enforces that.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crate/**'
      - 'src/extraction/**'
      - 'src/mcp/**'
      - 'scripts/check-extraction-parity.ts'
      - '.github/workflows/ci-crate.yml'
  pull_request:
    paths:
      - 'crate/**'
      - 'src/extraction/**'
      - 'src/mcp/**'
      - 'scripts/check-extraction-parity.ts'
      - '.github/workflows/ci-crate.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: crate

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.88"
      - name: Verify the declared rust-version actually builds
        run: cargo check --locked

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Forbid inline lint suppressions
        working-directory: .
        run: |
          if grep -rn '#\[allow(' crate/src --include='*.rs'; then
            echo 'Inline #[allow] found — fix the lint or relax it in [lints.clippy] in crate/Cargo.toml.'
            exit 1
          fi
      # extract/ is the layer the corpus pins and the layer that must
      # stay pure. A filesystem call in it means the "testable from a
      # fixture file, no flake" claim in AGENTS.md has quietly stopped
      # being true.
      - name: Forbid filesystem access in the pure extraction layer
        working-directory: .
        run: |
          # Comment lines are filtered out: the module doc in
          # extract/mod.rs names `std::fs` to say it must not appear.
          if grep -rn 'std::fs\|File::open' crate/src/extract --include='*.rs' \
             | grep -v ':[0-9]*: *//'; then
            echo 'extract/ must not touch the filesystem — that belongs in walk.rs and scan.rs.'
            exit 1
          fi

  # AGENTS.md sets a 90% line coverage floor per module for extract/.
  # Enforced per module, not on the total: a total hides one module
  # sliding while the others carry it. Scoped to extract/ because
  # everything else is I/O verified by the contract and scenario jobs.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage
        run: |
          cargo llvm-cov --no-report
          cargo llvm-cov report --json --output-path coverage.json
          cargo llvm-cov report --html
      - name: Publish the browsable report
        # Uploaded even when the floor check fails — a failing run is
        # exactly when someone wants to see which lines are uncovered.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: crate/target/llvm-cov/html/
          if-no-files-found: error
      - name: Enforce the per-module floor on extract/
        run: |
          python3 - <<'PY'
          import json, sys
          FLOOR = 90.0
          files = json.load(open("coverage.json"))["data"][0]["files"]
          under = []
          for f in files:
              if "/extract/" not in f["filename"]:
                  continue
              name = f["filename"].split("/")[-1]
              if name in ("corpus.rs", "fuzz.rs"):
                  continue  # test-only scaffolding: the corpus runner and the fuzz target
              pct = f["summary"]["lines"]["percent"]
              print(f"{name:16} {pct:6.2f}%")
              if pct < FLOOR:
                  under.append((name, pct))
          if under:
              print(f"\nAGENTS.md sets a {FLOOR}% line coverage floor per module in extract/:")
              for name, pct in under:
                  print(f"  {name}: {pct:.2f}%")
              sys.exit(1)
          PY

  # What only a document too big for the fast path can prove: the
  # 50,000-URL cap, and that the scanner stays linear while reaching it.
  scenarios:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Scenarios against an oversized document
        env:
          URLS_LE_SCENARIOS: "1"
        run: cargo test --test scenarios -- --test-threads=1

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-audit
      - run: cargo audit

  # Documents and filesystems that break tools, run against the built
  # binary over a tree the test constructs. Not a fixture directory:
  # Windows cannot check in a FIFO, a symlink loop or a
  # permission-denied file, so the tree is built at runtime and each
  # case the platform cannot express says by name that it did not run.
  #
  # Every case asserts the same floor: no panic, no hang, and an exit
  # code of 0, 1 or 2 — never a signal.
  hazards:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - run: cargo test --locked --test hazards -- --nocapture

  # Behaviour that differs by operating system, asserted rather than
  # hoped: `/` in every reported path, independence from TZ, one report
  # line per file on a case-folding filesystem, a walk that survives a
  # reserved Windows filename, and a stdin race asserted on the exit
  # code rather than on the write.
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - run: cargo test --locked --test platform -- --nocapture
      # The suite twice, because Windows ignores TZ entirely: a suite
      # that depends on it passes on two platforms and fails on the
      # third. tests/platform.rs asserts the binary's output is
      # byte-identical under both; these two steps assert the suite is.
      - name: The whole suite with TZ=UTC
        env:
          TZ: UTC
        run: cargo test --locked
      - name: The whole suite with TZ unset
        run: cargo test --locked

  # The corpus pins the cases somebody thought of; this generates the
  # ones nobody did, and requires both MCP servers to answer the SHARED
  # extract_urls tool identically — same document in, same envelope out.
  #
  # Scoped to that tool on purpose. The CLI is terminal-first (a tree
  # walk, exit codes, JSON Lines, --strict) and the extension is
  # IDE-first; those surfaces are meant to differ. What may not differ
  # is the one tool both of them offer under the same name.
  differential:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: cargo build --locked --release
      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      # A fixed seed so a failure reproduces, and the seed is printed on
      # every run, pass or fail.
      - name: Generated documents, both servers
        working-directory: .
        env:
          URLS_LE_BIN: crate/target/release/urls-le
          DIFFERENTIAL_SEED: '20260812'
          DIFFERENTIAL_CASES: '4000'
        run: bun scripts/differential.ts

  # A standing net over the pure layer — the scanner, the delimiter
  # class and the eleven subset rules. Sixty seconds, not to
  # convergence. Any panic, any hang, any reported span that does not
  # line up with its source is a failure, and the seed is printed so a
  # red build reproduces.
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Fuzz the extraction layer for sixty seconds
        env:
          URLS_LE_FUZZ_SECONDS: '60'
        run: cargo test --locked --release extract::fuzz -- --nocapture --test-threads=1

  # A wall-clock ceiling on a fixed tree, and a linearity check on top
  # of it. A sibling in this family was fifty times slower than the rest
  # for a whole release because nothing measured it. Ubuntu only: a
  # timing assertion on three shared runners is three chances to flake
  # for a reason that has nothing to do with the code.
  budget:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Scan a 500-file tree inside its budget
        env:
          URLS_LE_BUDGET: '1'
        run: cargo test --locked --release --test budget -- --nocapture --test-threads=1

  # Does this crate open what it claims to open? One file per alias plus
  # a dozen extensions the table has never heard of, walked once — a
  # file the walk skips is a failure, and so is an advertised format
  # with no corpus document. This is the check that would have made
  # "opens 21 of 88" visible without anyone counting by hand.
  coverage-matrix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - run: cargo test --locked --test coverage_matrix -- --nocapture

  # Fails when the extension's extraction behaviour and the shared
  # corpus (crate/fixtures/) disagree — the reason both frontends live
  # in one repo at all.
  parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Extraction and MCP parity
        working-directory: .
        run: bun scripts/check-extraction-parity.ts
