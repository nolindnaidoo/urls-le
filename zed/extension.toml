id = "urls-le"
name = "URLs-LE"
description = "Extract URLs from documentation, configuration and code — as a tool the agent panel can call."
version = "2.2.0"
schema_version = 1
authors = ["nolindnaidoo"]
repository = "https://github.com/nolindnaidoo/urls-le"

# Zed's extension API offers languages, debuggers, themes, snippets, slash
# commands and context servers — it has no way to read the active buffer or
# register a command, which is what the VS Code extension is built on. A
# context server is the surface that fits: the same extraction engine, reached
# through the agent panel instead of the command palette.
[context_servers.urls-le]
